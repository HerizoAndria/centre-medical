spring.application.name=centre-medical-backend

# ==== Connexion MySQL ====
# Adapter l'URL, le nom d'utilisateur et le mot de passe a votre installation
spring.datasource.url=jdbc:mysql://localhost:3306/centre_medical
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==== JPA / Hibernate ====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==== Serveur ====
server.port=8080

# ==== Jackson (format de date) ====
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false
